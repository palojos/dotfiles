set -g mouse on               # Enable mouse clicking, resizing, and scrolling
set -g base-index 1           # Start window listings at 1
setw -g pane-base-index 1     # Start pane matrices at 1
set -g renumber-windows on    # Keep numbers sequential when tabs die
set -g escape-time 0          # Drop command delay down to absolute zero
set -g history-limit 50000

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded!"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

set -g status-style bg=#181825,fg=#cdd6f4
set -g status-interval 1

# Borders tracking active frames
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#cba6f7 # Mauve accent highlight

# Status bar geometry blocks
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=default,fg=default] "
set -g status-right ""
set -g status-left-length 20
set -g status-right-length 0 

# Active window indicator formatting
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W* "
