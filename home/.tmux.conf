set -g mouse on               # Enable mouse clicking, resizing, and scrolling
set -g base-index 1           # Start window listings at 1
setw -g pane-base-index 1     # Start pane matrices at 1
set -g renumber-windows on    # Keep numbers sequential when tabs die
set -g escape-time 0          # Drop command delay down to absolute zero
set -g history-limit 50000

bind r source-file ~/.tmux.conf \; display-message "tmux reloaded!"

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

set -g status-style bg=#181825,fg=#cdd6f4
set -g status-interval 1

# Borders tracking active frames
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#cba6f7 # Mauve accent highlight

# Status bar geometry blocks
set -g status-left "#[bg=#89b4fa,fg=#11111b,bold] #S #[bg=default,fg=default] "
set -g status-right ""
set -g status-left-length 20
set -g status-right-length 0 

# Active window indicator formatting
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W* "

# Automatic restoration setup

set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

# --- GLOBAL PLUGINS LIST ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Core layout saving engine
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Background timer framework for fully hands-free saves/restores
set -g @plugin 'tmux-plugins/tmux-continuum'

# catppuccin
set -g @plugin 'catppuccin/tmux'

# --- CONFIGURING ENGINE BEHAVIOR ---
# 1. Neovim Session Restoration - allows tmux to restore active nvim buffers!
set -g @resurrect-strategy-nvim 'session'

# 2. Enable automatic continuous background saves every 15 minutes
set -g @continuum-save-interval '15'

# 3. Enable automatic restore when tmux server launches on boot
set -g @continuum-restore 'on'

set -g @catppuccin_flavor 'mocha' 

# Visual layout styling for the bottom status bar
set -g @catppuccin_window_status_style "round"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_window_text " #{window_name}"
set -g @catppuccin_window_current_text " #{window_name}"
set -g @catppuccin_window_default_text " #{window_name}"

# --- RUN PLUGINS MANAGER ---
# (Keep this line at the absolute bottom of the configuration file)
run '~/.tmux/plugins/tpm/tpm'
